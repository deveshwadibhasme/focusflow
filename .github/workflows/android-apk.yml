
name: Build FocusFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK
        shell: bash
        run: |
          mkdir -p output
          eas build:download --platform android --latest --path output/FocusFlow.apk

      - name: Upload FocusFlow APK
        uses: actions/upload-artifact@v6
        with:
          name: FocusFlow
          path: output/FocusFlow.apk
          if-no-files-found: error
